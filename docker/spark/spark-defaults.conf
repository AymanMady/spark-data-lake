# =============================================================================
#  Default Spark configuration, read automatically by spark-submit and by
#  SparkSession.builder (file /opt/spark/conf/spark-defaults.conf).
#
#  Precedence in Spark (strongest to weakest):
#     1. .config() in the Python code
#     2. --conf options of spark-submit
#     3. THIS file
#     4. Spark's own defaults
# =============================================================================

# ---- Where to send the jobs --------------------------------------------------
# URL of the standalone cluster. "spark-master" = the docker service name.
# (Locally, without a cluster, we would write local[*]: see phase 4.)
spark.master                      spark://spark-master:7077

# ---- Resources ---------------------------------------------------------------
# The DRIVER is the process that builds the plan and steers the job.
spark.driver.memory               1g
# An EXECUTOR is a JVM process that actually runs the tasks.
# Worker = 4 cores / 4 GB  ->  2 executors of 2 cores and 2 GB each.
spark.executor.memory             2g
spark.executor.cores              2

# ---- SQL / shuffle -----------------------------------------------------------
# Number of partitions AFTER a shuffle (groupBy, join...).
# Spark default = 200: far too many for a local machine, it creates 200 tiny
# tasks whose scheduling costs more than the computation itself.
spark.sql.shuffle.partitions      8

# AQE (Adaptive Query Execution): Spark adjusts the plan during execution from
# the real statistics. Enabled by default since Spark 3.2.
# We leave it on, but turn it off now and then in phases 11/12 to observe the
# "raw" plans.
spark.sql.adaptive.enabled        true

# All dates/timestamps in UTC: avoids results that differ depending on the
# machine's time zone (a classic data engineering trap).
spark.sql.session.timeZone        UTC

# ---- Miscellaneous -----------------------------------------------------------
spark.ui.showConsoleProgress      true

# ---- Deterministic startup ---------------------------------------------------
# By default the driver starts working as soon as ONE executor is ready.
# Consequence: spark.defaultParallelism (and therefore the partition count)
# changes from one run to the next -> results impossible to compare.
# We ask the driver to wait for 100% of the resources before starting.
spark.scheduler.minRegisteredResourcesRatio        1.0
spark.scheduler.maxRegisteredResourcesWaitingTime  30s
