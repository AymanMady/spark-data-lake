# Tooling configuration. The project is run through the Makefile, not installed
# as a package, so there is no [project] table here on purpose.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # outdated syntax
    "B",    # likely bugs
    "C4",   # comprehensions
    "SIM",  # needless complexity
]

[tool.ruff.lint.isort]
# The project packs several names per line inside a parenthesised import.
# Without this, the trailing comma would force isort to explode them one per line.
split-on-trailing-comma = false
